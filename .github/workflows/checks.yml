name: checks

# Three cheap gates that catch every failure mode a reviewer cannot see:
# a derived copy that drifted from the canonical style, a malformed manifest,
# and a broken evaluation case catalog.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every agent-specific copy matches the canonical style
        run: python3 scripts/sync_style.py --check

      - name: Manifests parse as JSON
        run: |
          for manifest in .claude-plugin/marketplace.json \
                          .claude-plugin/plugin.json \
                          .codex-plugin/plugin.json \
                          gemini-extension.json \
                          evals/runners.example.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$manifest" \
              || { echo "::error file=$manifest::invalid JSON"; exit 1; }
          done

      - name: Evaluation cases are valid
        run: python3 scripts/run_evals.py validate

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
